services:
  frontend:
    build:
      context: .
      target: run_dev
    container_name: bibomarket-frontend
    env_file:
      - .env
    ports:
      # Next.js écoute sur 8080 (voir package.json).
      - '3006:8080'
      # 5555 est souvent pris par l'émulateur Android (qemu/adb) sur l'hôte.
      - '5556:5555'
    volumes:
      - .:/app
      - /app/node_modules
      # Évite la boucle HMR : les écritures dans .next ne doivent pas retrigger le watcher du bind mount.
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - API_URL=http://backend:3000
      - NEXT_PUBLIC_API_URL=http://localhost:3005/api
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
    networks:
      - bibomarket-network

  backend:
    image: bibocomdigital/bibomarket-backend-develop:latest
    env_file:
      - .env.backend
    environment:
      - NODE_ENV=development
    ports:
      - '3005:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - bibomarket-network

  # redis:
  #   image: redis:7
  #   container_name: redis-bibomarket-frontend
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   networks:
  #     - bibomarket-network

networks:
  bibomarket-network:
    driver: bridge

services:
  frontend:
    build:
      context: .
      target: run_dev
    container_name: bibomarket-frontend
    env_file:
      - .env
    ports:
      # Next.js écoute sur 8080 (voir package.json).
      - '3006:8080'
    volumes:
      - .:/app
      - /app/node_modules
      # Évite la boucle HMR : les écritures dans .next ne doivent pas retrigger le watcher du bind mount.
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      # Base du backend (avec préfixe /api) utilisée par les rewrites Next.js côté serveur.
      - API_URL=http://backend:3000/api
      - NEXT_PUBLIC_API_URL=http://localhost:3005/api
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
    networks:
      - bibomarket-network

  backend:
    image: bibocomdigital/bibomarket-backend-develop:latest
    env_file:
      - .env.backend
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    ports:
      - '3005:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - bibomarket-network

  redis:
    image: redis:7-alpine
    container_name: redis-bibomarket
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - bibomarket-network
    volumes:
      - redis_data_market:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    container_name: postgres-bibomarket-backend
    restart: unless-stopped
    ports:
      - '5432:5432'
    networks:
      - bibomarket-network
    environment:
      - POSTGRES_USER=bibomarket
      - POSTGRES_PASSWORD=bibopassword
      - POSTGRES_DB=biboMarket
    volumes:
      - postgres_data_market:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bibomarket -d biboMarket']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data_market:
    driver: local
  redis_data_market:
    driver: local

networks:
  bibomarket-network:
    driver: bridge
services:
  frontend:
    build:
      context: .
      target: run_dev
    container_name: bibomarket-frontend
    env_file:
      - .env
    ports:
      # Next.js écoute sur 8080 (voir package.json).
      - '3006:8080'
      # 5555 est souvent pris par l'émulateur Android (qemu/adb) sur l'hôte.
      - '5556:5555'
    volumes:
      - .:/app
      - /app/node_modules
      # Évite la boucle HMR : les écritures dans .next ne doivent pas retrigger le watcher du bind mount.
      - /app/.next
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - WATCHPACK_POLLING=true
      # Même API que le mobile : BiboMarketBack publié sur l'hôte :3007
      - API_URL=http://host.docker.internal:3007/api
      - NEXT_PUBLIC_API_URL=http://localhost:3007/api
    command: ["npm", "run", "dev"]
    networks:
      - bibomarket-network

  # L'API canonique est BiboMarketBack (port hôte 3007), déjà lancée à part.
  # Ne plus démarrer l'image bibomarket-backend-develop (port 3005, Prisma cloud).

  postgres:
    image: postgres:17
    container_name: postgres-bibomarket-backend
    restart: unless-stopped
    ports:
      - '5432:5432'
    networks:
      - bibomarket-network
    environment:
      - POSTGRES_USER=bibomarket
      - POSTGRES_PASSWORD=bibopassword
      - POSTGRES_DB=biboMarket
    volumes:
      - postgres_data_market:/var/lib/postgresql/data

  # Create a volume for the postgres data
volumes:
  postgres_data_market:
    driver: local

networks:
  bibomarket-network:
    driver: bridge

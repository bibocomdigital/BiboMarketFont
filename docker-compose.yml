services:
  frontend:
    build:
      context: .
      target: run_dev
    container_name: waxci-web-frontend
    env_file:
      - .env
    ports:
      - '3006:3000'
      - '5555:5555'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - API_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - waxci-network

  backend:
    image: bibocomdigital/waxci-backend-develop:latest
    env_file:
      - .env.backend
    ports:
      - '3005:3000'
    # depends_on:
    #   - redis
    networks:
      - waxci-network

  # redis:
  #   image: redis:7
  #   container_name: redisWaxci-frontend
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379' 
  #   networks:
  #     - waxci-network

networks:
  waxci-network:
    driver: bridge

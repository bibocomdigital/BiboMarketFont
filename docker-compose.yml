services:
  frontend:
    build:
      context: .
      target: run_dev
    container_name: bibomarket-frontend
    env_file:
      - .env
    ports:
      # Next.js écoute sur 8080 (voir package.json).
      - '3006:8080'
      # 5555 est souvent pris par l'émulateur Android (qemu/adb) sur l'hôte.
      - '5556:5555'
    volumes:
      - .:/app
      - /app/node_modules
      # Évite la boucle HMR : les écritures dans .next ne doivent pas retrigger le watcher du bind mount.
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - API_URL=http://backend:3000
      - NEXT_PUBLIC_API_URL=http://localhost:3005/api
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
    networks:
      - bibomarket-network

  backend:
    image: bibocomdigital/bibomarket-backend-develop:latest
    env_file:
      - .env.backend
    environment:
      - NODE_ENV=development
    ports:
      - '3005:3000'
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - bibomarket-network

  postgres:
    image: postgres:17
    container_name: postgres-bibomarket
    environment:
      POSTGRES_DB: biboMarket
      POSTGRES_USER: bibouser
      POSTGRES_PASSWORD: bibopassword
    ports:
      - '5436:5432'
    volumes:
      - bibomarket_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bibouser -d biboMarket']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bibomarket-network

  # redis:
  #   image: redis:7
  #   container_name: redis-bibomarket-frontend
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   networks:
  #     - bibomarket-network

volumes:
  bibomarket_postgres_data:

networks:
  bibomarket-network:
    driver: bridge

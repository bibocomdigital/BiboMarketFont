name: CI pour les pull request dans master

on:
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-22.04

    environment: prod

    env:
      APP_NAME: nextjs-app
      NODE_ENV: production

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image localement
        run: |
          docker build -t ${{ env.APP_NAME }}:test .

      - name: Run container for healthcheck
        run: |
          docker run -d --name temp-app -p 3000:3000 nest-app:test

          for i in {1..20}; do
            if curl -f http://localhost:3000/health; then
              echo "Application prête"
              break
            fi
            sleep 3
          done

          docker logs temp-app
          docker stop temp-app
          docker rm temp-app

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ github.ref_name }}